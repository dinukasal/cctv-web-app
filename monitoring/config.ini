# WifiTunnelMonitor configuration
# After editing this file, restart the service / let the next scheduled run pick it up.
#
# Preferred Wi-Fi network the laptop should stay on:
ssid=HomeWiFi_5G
#
# Fallback Wi-Fi network used when the preferred one has no internet or the
# tunnel cannot be reached through it:
fallback_ssid=HomeWiFi_2.4G
#
# Public hostname used to health-check the Cloudflare Tunnel.
# A Cloudflare 530 / error 1033 response means the tunnel is down.
url=https://cam.example.com
#
# Name of the Windows service that runs the tunnel:
service=Cloudflared
#
# Seconds between monitoring cycles (service mode only; minimum 5):
interval=30
#
# ---- Restart policy (stops self-inflicted tunnel outages) ----------------
# Number of consecutive failed checks before cloudflared is restarted:
fail_threshold=3
#
# Minimum seconds between two cloudflared restarts:
restart_cooldown=600
#
# Failed checks before trying the fallback SSID, and the minimum seconds
# between two SSID switches:
failover_after=2
failover_cooldown=900
#
# While running on the fallback SSID, re-test the preferred SSID this often
# (seconds) so the laptop returns to 5 GHz once it recovers. 0 = never.
primary_recheck=1800
